<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>帕斯卡画廊 | 作品管理</title>
    <link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="admin.css">
  </head>
  <body>
    <header class="admin-header">
      <a href="../index.html"><img src="../assets/brand/pascal-gallery-logo.svg" alt="帕斯卡画廊"></a>
      <div><strong>作品信息管理</strong><span id="save-status" aria-live="polite">正在读取作品数据</span></div>
      <button id="save-button" class="primary" type="button">保存到 GitHub</button>
    </header>

    <section class="auth-bar" aria-label="GitHub 授权">
      <label for="github-token">GitHub 精细权限令牌</label>
      <input id="github-token" type="password" autocomplete="off" placeholder="仅保存在当前浏览器会话">
      <button id="connect-button" type="button">连接 GitHub</button>
      <button id="logout-button" type="button">清除授权</button>
      <span id="connection-status" aria-live="polite">未连接</span>
    </section>

    <main class="admin-layout">
      <aside class="work-sidebar">
        <div class="sidebar-actions">
          <label for="admin-search">搜索作品</label>
          <input id="admin-search" type="search" placeholder="编号、艺术家、作品名">
          <select id="admin-status" aria-label="按状态筛选">
            <option value="all">全部状态</option><option value="draft">草稿</option><option value="published">已上架</option>
          </select>
          <button id="add-button" class="primary" type="button">新增作品</button>
        </div>
        <div id="work-count" class="work-count"></div>
        <div id="admin-work-list" class="admin-work-list" aria-live="polite"></div>
      </aside>

      <section class="editor" aria-labelledby="editor-title">
        <div class="editor-title-row">
          <div><span id="editor-number">请选择作品</span><h1 id="editor-title">作品信息</h1></div>
          <button id="delete-button" class="danger" type="button">删除作品</button>
        </div>
        <form id="work-form">
          <div class="image-editor">
            <div class="image-preview"><img id="image-preview" alt="作品图片预览"><span id="image-empty">暂无图片</span></div>
            <label class="upload-button" for="image-file">替换作品图片</label>
            <input id="image-file" type="file" accept="image/jpeg,image/png,image/webp">
          </div>
          <div class="form-grid">
            <label>库存编号<input name="inventoryNo" required></label>
            <label>作品名称<input name="title" required></label>
            <label>艺术家<input name="artist" required></label>
            <label>创作年份<input name="year"></label>
            <label>艺术品种类<select name="category"><option value="painting">绘画</option><option value="sculpture">雕塑</option><option value="mixed-media">综合材料</option><option value="paper">纸本</option><option value="photo-video">摄影/影像</option><option value="art-derivative">艺术衍生品</option></select></label>
            <label>媒介<input name="medium"></label>
            <label>尺寸<input name="dimensions"></label>
            <label>价格<input name="price"></label>
            <label>销售状态<select name="status"><option>待整理</option><option>在售</option><option>可洽谈</option><option>已售</option><option>不出售</option></select></label>
            <label>公开状态<select name="publishStatus"><option value="draft">草稿/不公开</option><option value="published">上架公开</option></select></label>
            <label class="checkbox"><input name="recommended" type="checkbox">设为推荐作品</label>
          </div>
          <label>作品介绍<textarea name="description" rows="4"></textarea></label>
          <label>推荐理由<textarea name="recommendedReason" rows="2"></textarea></label>
          <label>内部备注（公开页不显示）<textarea name="notes" rows="3"></textarea></label>
          <fieldset><legend>来源记录</legend><div class="form-grid"><label>来源文件<input name="sourceDeck"></label><label>来源页码<input name="sourceSlide" type="number" min="0"></label></div></fieldset>
        </form>
        <div class="data-actions">
          <label for="import-file">导入 JSON</label><input id="import-file" type="file" accept="application/json">
          <button id="export-button" type="button">导出 JSON</button>
          <span>导入会替换当前编辑数据，保存到 GitHub 后才会发布。</span>
        </div>
      </section>
    </main>
    <script type="module" src="works-admin.js"></script>
  </body>
</html>
